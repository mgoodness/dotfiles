[update]
cooldown_days = 7

[[repos]]
hooks = [{ id = "md-toc", args = ["--in-place", "--skip-lines=1", "github"] }]
repo = "https://github.com/frnmst/md-toc"
rev = "9.0.0"

[[repos]]
hooks = [{ id = "codespell", args = ["--ignore-words-list=protols,flate"] }]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"

[[repos]]
repo = "local"

[[repos.hooks]]
entry = "fish_indent --write"
id = "fish_indent"
language = "system"
name = "fish_indent"
types = ["fish"]

[[repos.hooks]]
entry = "oxfmt --no-error-on-unmatched-pattern"
exclude = "(^|/)(modify_.*\\.json|symlink_[^/]+)$"
id = "oxfmt"
language = "system"
name = "oxfmt"
types = ["text"]

[[repos.hooks]]
entry = "bash -c 'for f in \"$@\"; do yq --inplace \"sort_keys(..)\" \"$f\"; done' --"
id = "sort-yaml"
language = "system"
name = "sort-yaml"
types = ["yaml"]

[[repos.hooks]]
entry = "taplo fmt --option reorder_keys=true"
id = "sort-toml"
language = "system"
name = "sort-toml"
types = ["toml"]

[[repos.hooks]]
entry = "bash -c 'for f in \"$@\"; do echo \"==> $f\"; chezmoi execute-template <\"$f\" >/dev/null || exit 1; done' --"
exclude = "^\\.chezmoi\\.toml\\.tmpl$"
files = "\\.tmpl$"
id = "chezmoi-templates"
language = "system"
name = "chezmoi-templates"
pass_filenames = true

[[repos.hooks]]
entry = "bash -c 'for f in \"$@\"; do echo \"==> $f\"; echo {} | chezmoi execute-template --with-stdin --file \"$f\" >/dev/null || exit 1; done' --"
files = "(^|/)modify_.*\\.json$"
id = "chezmoi-modify-templates"
language = "system"
name = "chezmoi-modify-templates"
pass_filenames = true
