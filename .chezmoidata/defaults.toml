# `defaults` settings, applied by .chezmoiscripts/run_onchange_after_19-defaults.sh.tmpl
# and checked for drift by `up defaults` (functions/__up_defaults.fish).
#
# [defaults."<domain>"]: one table per `defaults` domain, one `key = value`
# per setting. The value's TOML type picks the `defaults` type flag (bool,
# integer → int, float, string), so write a float with a decimal point
# (`12.0`). Quote a key that contains a dot. `up defaults` compares each
# setting against the live one.
#
# [defaultsDiscover."<domain>"]: also report live keys in that domain that
# aren't declared here, so a change made in an app's UI shows up with a
# paste-ready entry. `ignore` globs mark runtime state that is never
# reported. Only worth it for a small, app-owned domain; macOS's own domains
# hold far too many keys to enumerate, so they get the declared-only check.
#
# Dock layout (dockutil), Touch ID for sudo and login items stay in
# run_onchange_after_20-macos.sh.tmpl: they aren't `defaults` values.

[defaultsDiscover."com.superlogical.rex"]
ignore = [
  "NSWindow*",
  "NSSplitView*",
  "SU*",
  "NSStatusItem*",
  "Onboarding.*",
  "RexSync.*",
  "rex.local-server.*",
  "rex.sync.*",
  "Workspace.lastFocusedSession",
  "Workspace.programActivitySeen",
]

# --- General ---
[defaults.NSGlobalDomain]

# Prefer tabs
AppleWindowTabbingMode = "always"

# Max trackpad speed
"com.apple.trackpad.scaling" = 3

# --- Dock ---
[defaults."com.apple.dock"]

# Place at bottom
orientation = "bottom"

# Hide recent apps
show-recents = false

# Minimize apps into itself
minimize-to-application = 1

# Enable magnification
magnification = 1

# Magnified icon size
largesize = 80

# Don't reorder Spaces by recent use
mru-spaces = false

# Hot corner, top left: Display sleep
wvous-tl-corner = 10

# Hot corner, top right: Notification center
wvous-tr-corner = 12

# --- Finder ---
[defaults."com.apple.finder"]

# Set default path to $HOME
NewWindowTarget = "PfHm"

# Use column view
FXPreferredViewStyle = "clmv"

# Sort folders first
_FXSortFoldersFirst = 1

# Enable copy from quicklook
QLEnableTextSelection = true

# Don't warn when emptying trash
WarnOnEmptyTrash = false

# Don't warn when changing an extension
FXEnableExtensionChangeWarning = false

# --- Software Update ---
[defaults."com.apple.SoftwareUpdate"]

# Check for updates daily
ScheduleFrequency = 1

# --- Rex ---
[defaults."com.superlogical.rex"]

# Rex owns the Dock/menu bar icon question: no status item while no
# window is open. Control Center's own NSStatusItem record is macOS's,
# not Rex's, so it is ignored rather than declared.
"Workspace.appIconVisibility" = "dockOnly"

# Allow agents to control the app (rex -C … do)
"rex.client.remoteControl" = true

# --- Rex's server ---
# The server's own settings, sitting alongside the client's below.

# Run the server bundled with the app
"rex.server.run-mode" = "bundled"

# Restart the server if it dies
"rex.server.automatic-restart-enabled" = true

# Don't reload block plugins when their source changes
"rex.server.block-plugin-reload-enabled" = false

# Serve the API over an embedded Tailscale node (tsnet), so other devices
# reach Rex without the Tailscale app installed anywhere. Only this switch
# is declared: the node's own identity (machine key, hostname, ts.net
# certificate) is runtime state under ~/Library/Application Support/rex/
# tsnet, enrolled once by `rex server tailscale login`, and the tailnet's
# ACLs live in Tailscale's admin console. This is per-machine in effect —
# every Mac that applies these dotfiles runs Rex with its own tsnet node
# and needs its own login.
"rex.server.tailnet-enabled" = true

# Copy selection to clipboard
"Workspace.terminalCopyOnSelect" = true

# Smooth scrolling
"Workspace.terminalSmoothScrolling" = true

# No glass behind panes
"Workspace.usesPaneGlass" = false

# Chrome follows the theme
"Workspace.interfaceStyle" = "useTheme"

# Fade inactive panes
"Workspace.inactivePaneFadeMode" = "both"

# Don't tint tab icons
"Workspace.tabIconTintMode" = "off"

# Standard inactive-window pane styles
"Workspace.usesStandardInactiveWindowPaneStyles" = true

# Agents don't name sessions: a session is a repo (labelled with its name)
# shared by several agents. Pi has no Rex hook, so this toggle can't stop it
# alone; the "Rex sessions" rule in dot_pi/agent/AGENTS.md covers the rest.
"rex.agents.names-sessions" = false

# Themes follow system appearance
"Workspace.lightThemeID" = "merino-light"

"Workspace.darkThemeID" = "merino-dark"

# Terminal font
"Workspace.terminalFontName" = "Menlo"

"Workspace.terminalFontPointSize" = 12.0

# No font smoothing
"Workspace.terminalFontSmoothing" = false

# Terminal colours follow the theme
"Workspace.terminalUseThemePalette" = true

# Sidebar on the left, collapsed, tabs stacked vertically
"Workspace.sidebarCollapsed" = false

"Workspace.sidebarPosition" = "left"

"Workspace.tabStyle" = "vertical"
