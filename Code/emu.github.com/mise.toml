[env]
CLOUDSDK_ACTIVE_CONFIG_NAME = "mlb"
GH_HOST = "github.com"
# No PI_DEFAULT_PROVIDER/PI_DEFAULT_MODEL override here: pi's default is now
# profile-seeded (dot_pi/agent/modify_settings.json seeds github-copilot on
# `.mlb`), so corporate work already bills against Copilot without a
# per-directory override. See dot_config/mise/config.toml.tmpl for why this
# exec() isn't redundant with fnox's own per-directory activation.
GH_TOKEN = { value = "{{ exec(cache_duration='7d', cache_key='emu-gh-token', command='/opt/homebrew/bin/fnox get GH_TOKEN') }}" }

[tools]
terraform = "latest"
terraform-docs = "latest"
