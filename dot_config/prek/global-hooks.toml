# Ref: https://codeberg.org/jsu/dotfiles/src/branch/main/prek/global-hooks.toml

[update]
cooldown_days = 7
# Never adopt a prerelease tag. Without this, autoupdate pins the newest tag
# overall, which for betterleaks was `v2.0.0-rc.1` (PR #48). Both dashed
# (`v2.0.0-rc.1`) and undashed (`v1.8.0rc1`) prerelease forms are covered;
# trailing `-1` style tags (shellcheck-py, pre-commit-shfmt) are not.
exclude_tags = [
  "*-{alpha,beta,rc,dev,pre,preview,snapshot,nightly}*",
  "*{alpha,beta,rc,dev,pre}[0-9]*",
]

[[repos]]
hooks = [
  { id = "check-added-large-files", priority = 0 },
  { id = "check-case-conflict", priority = 0 },
  { id = "check-executables-have-shebangs", priority = 0 },
  { id = "check-illegal-windows-names", priority = 0 },
  { id = "check-json5", priority = 0 },
  { id = "check-merge-conflict", args = [
    "--assume-in-merge",
  ], priority = 0 },
  { id = "check-shebang-scripts-are-executable", priority = 0 },
  { id = "check-symlinks", priority = 0 },
  { id = "check-toml", priority = 0 },
  { id = "check-vcs-permalinks", priority = 0 },
  { id = "check-xml", priority = 0 },
  { id = "check-yaml", exclude = "/templates/", priority = 0 },
  { id = "destroyed-symlinks", priority = 0 },
  { id = "detect-private-key", priority = 0 },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]
repo = "builtin"

[[repos]]
hooks = [{ id = "check-hooks-apply" }, { id = "check-useless-excludes" }]
repo = "meta"

[[repos]]
hooks = [{ id = "betterleaks", priority = 0 }]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.9.0"

[[repos]]
hooks = [{ id = "zizmor", args = ["--no-progress", "--fix=all"] }]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.30.1"

[[repos]]
hooks = [{ id = "actionlint" }]
repo = "https://github.com/kjanat/actionlint" # fork: rhysd/actionlint is inactive
rev = "v1.17"

[[repos]]
hooks = [
  { id = "shellcheck", exclude = ".*\\.tmpl$", exclude_types = [
    "zsh",
  ] }, # https://github.com/koalaman/shellcheck/issues/809
]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"

[[repos]]
hooks = [
  { id = "shfmt", args = [
    "--indent=4",
    "--write",
    "--keep-padding",
  ], exclude = ".*\\.tmpl$" },
]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.14.1-1"
